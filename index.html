<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Budget — autorizzazione</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120% 120% at 20% 0%, #1b1147 0%, #0b1024 55%, #05060d 100%);
      color: #f2f5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { text-align: center; padding: 32px; max-width: 420px; }
    .icon { font-size: 44px; }
    h1 { font-size: 20px; margin: 14px 0 8px; font-weight: 600; }
    p { color: #9aa6c4; font-size: 14px; margin: 0 0 14px; }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 14px;
      border: 1px solid rgba(124, 92, 255, .5);
      background: rgba(124, 92, 255, .18);
      color: #f2f5ff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">&#128274;</div>
    <h1>Autorizzazione completata</h1>
    <p id="status">Apro l'app Budget&hellip;</p>
    <p><a id="manual" href="#">Apri Budget</a></p>
  </main>

  <script>
    // Forward the Enable Banking callback to the app's private scheme.
    // Nothing is stored, logged or sent anywhere: the browser just hands the
    // one-time code back to the device.
    (function () {
      var target = "com.giova.budget://enablebanking" + (window.location.search || "");
      var manual = document.getElementById("manual");
      manual.href = target;

      // Chrome may block an automatic external-protocol launch without a user
      // gesture, so the button is always visible as a fallback.
      window.location.replace(target);

      setTimeout(function () {
        document.getElementById("status").textContent =
          "Se non si apre da sola, tocca il pulsante qui sotto.";
      }, 1200);
    })();
  </script>
</body>
</html>
